# Publishes the game to GitHub Pages on every push to main.
#
# deploy.sh builds the same tree it rsyncs to a host -- only what the browser
# loads, every ES module import stamped with ?v=<hash> -- into _site/, and
# that is what Pages serves. The stamp matters: Pages sends max-age=600, so
# without it a browser can pair a new module with a cached old import for
# ten minutes after a push.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - run: sh deploy.sh _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
